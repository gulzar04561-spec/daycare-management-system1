<%- include('partials/header.html', { title }) %>
<div class="auth-shell"><section class="auth-card"><div class="eyebrow">Join our daycare community</div><h1>Create a parent account</h1><p>Register to add your child and request daycare bookings.</p>
<form action="/register" method="post" class="form-grid">
  <div class="field"><label for="name">Full name</label><input id="name" name="name" required maxlength="100" autocomplete="name" placeholder="Your full name"></div>
  <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="160" autocomplete="email" placeholder="you@example.com"></div>
  <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="Optional contact number"></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"><span class="helper">Use at least 8 characters.</span></div>
  <div class="form-actions"><button type="submit">Create account</button></div>
</form><p class="mt-16 mb-0">Already registered? <a href="/login">Log in</a></p></section></div>
<%- include('partials/footer.html') %>
