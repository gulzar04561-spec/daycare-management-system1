<%- include('partials/header.html', { title }) %>
<div class="page-heading"><div><div class="eyebrow">Team directory</div><h1>Add a staff member</h1><p>Staff accounts are created by an administrator.</p></div><a class="button secondary" href="/staff">← Back to staff</a></div>
<section class="panel"><form action="/staff" method="post" class="form-grid"><div class="field"><label for="name">Full name *</label><input id="name" name="name" required maxlength="100"></div><div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" required maxlength="160"></div><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" maxlength="30"></div><div class="field"><label for="password">Temporary password *</label><input id="password" name="password" type="password" required minlength="8"><span class="helper">At least 8 characters.</span></div><div class="form-actions"><button type="submit">Create staff account</button><a class="button secondary" href="/staff">Cancel</a></div></form></section>
